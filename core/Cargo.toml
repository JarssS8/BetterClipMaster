[package]
name = "godclipboard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core logic for godclipboard: model, SQLite store, fuzzy search, privacy and clipboard watcher"

[lib]
name = "godclipboard_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
