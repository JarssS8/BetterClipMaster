name: Release

# On every push to master, build native bundles for Windows and Linux and
# publish a new GitHub Release. The version is derived as
# <major>.<minor>.<run_number> (major.minor taken from app/tauri.conf.json),
# guaranteeing a fresh, monotonically increasing release each time.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        shell: bash
        run: |
          base=$(jq -r .version app/tauri.conf.json)
          majmin=${base%.*}
          version="${majmin}.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

  release:
    name: Build & release (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            build-essential

      - name: Stamp version into tauri.conf.json
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          tmp=$(mktemp)
          jq --arg v "$version" '.version = $v' app/tauri.conf.json > "$tmp"
          mv "$tmp" app/tauri.conf.json
          echo "Stamped version $version"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v${{ needs.version.outputs.version }}
          releaseName: godclipboard v${{ needs.version.outputs.version }}
          releaseBody: "Automated release from master. See commit history for changes."
          releaseDraft: false
          prerelease: false
