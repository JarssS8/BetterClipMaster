name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (test + fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -p godclipboard-core -- --check
      - name: Clippy
        run: cargo clippy -p godclipboard-core -- -D warnings
      - name: Test
        run: cargo test -p godclipboard-core

  app:
    name: Build app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            build-essential
      - name: Clippy (app)
        run: cargo clippy -p godclipboard --all-targets -- -D warnings
      - name: Build (app, no bundle)
        run: cargo build -p godclipboard --release
